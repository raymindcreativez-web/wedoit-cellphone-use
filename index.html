<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bantai - Project RAI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- html5-qrcode library for high-performance QR code scanning -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-view {
            animation: fadeIn 0.35s ease-out forwards;
        }
        /* Custom scrollbar for log tables and modals */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Animated Scanner Laser Line */
        @keyframes scanBeam {
            0% { top: 10%; opacity: 0.3; }
            50% { top: 85%; opacity: 0.9; }
            100% { top: 10%; opacity: 0.3; }
        }
        .scan-laser {
            position: absolute;
            left: 5%;
            right: 5%;
            height: 3px;
            background: linear-gradient(90deg, rgba(239, 68, 68, 0) 0%, #ef4444 50%, rgba(239, 68, 68, 0) 100%);
            box-shadow: 0 0 12px #ef4444, 0 0 4px #ef4444;
            animation: scanBeam 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // School Roster: Grades, Sections, and Advisers
        const SCHOOL_DATA = {
            "Grade 7": [
                { name: "SSC7", adviser: "Emie Joy L. Fabellore" },
                { name: "Amethyst", adviser: "Emili Jun M. Galario" },
                { name: "Diamond", adviser: "Estephanie F. Morada" },
                { name: "Gold", adviser: "Mary Grace M. Ylagan" }
            ],
            "Grade 8": [
                { name: "Faraday", adviser: "Clarise F. Panoy" },
                { name: "Einstein", adviser: "Jesibel F. Trogon" },
                { name: "Newton", adviser: "Lea T. Gregorio" },
                { name: "SSC8", adviser: "Veryl F. Fajarillo" }
            ],
            "Grade 9": [
                { name: "SSC9", adviser: "Edgie F. Servanez" },
                { name: "Homer", adviser: "Faith F. Mangoba" },
                { name: "Shakespeare", adviser: "Geraldine C. Pampo" },
                { name: "Rizal", adviser: "Rio G. Cortez" }
            ],
            "Grade 10": [
                { name: "Uranus", adviser: "Christian Jay V. Gaa" },
                { name: "SSC", adviser: "Elranie C. Faigao" },
                { name: "Jupiter", adviser: "Helen Rose M. Anastacio" },
                { name: "Neptune", adviser: "Katherine G. Taborete" }
            ],
            "Grade 11": [
                { name: "ACAD1", adviser: "Rea G. Cortez" },
                { name: "ACAD2", adviser: "Alvin F. Faa" },
                { name: "ACAD3", adviser: "Jonah F. Fajarillo" }
            ],
            "Grade 12": [
                { name: "ABM", adviser: "Frank Jerico F. Machon" },
                { name: "HUMSS1", adviser: "Jeannie C. Perez" },
                { name: "HUMSS2", adviser: "Vincent F. Fallaria" }
            ]
        };

        // Storage Database Keys
        const STORAGE_KEYS = {
            STUDENTS: 'BANTAI_STUDENTS_V1',
            LOGS: 'BANTAI_LOGS_V1'
        };

        // Database Storage Helpers
        const db = {
            getStudents: () => {
                try {
                    const raw = localStorage.getItem(STORAGE_KEYS.STUDENTS);
                    return raw ? JSON.parse(raw) : {};
                } catch (e) {
                    console.error("Failed to read students DB:", e);
                    return {};
                }
            },
            saveStudents: (students) => {
                try {
                    localStorage.setItem(STORAGE_KEYS.STUDENTS, JSON.stringify(students));
                } catch (e) {
                    console.error("Failed to save students DB:", e);
                }
            },
            getLogs: () => {
                try {
                    const raw = localStorage.getItem(STORAGE_KEYS.LOGS);
                    return raw ? JSON.parse(raw) : [];
                } catch (e) {
                    console.error("Failed to read incident logs:", e);
                    return [];
                }
            },
            saveLogs: (logs) => {
                try {
                    localStorage.setItem(STORAGE_KEYS.LOGS, JSON.stringify(logs));
                } catch (e) {
                    console.error("Failed to save incident logs:", e);
                }
            }
        };

        // ==========================================
        // UI ICONS
        // ==========================================
        const AlertIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-red-500" viewBox="0 0 20 20" fill="currentColor">
                <path fillRule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clipRule="evenodd" />
            </svg>
        );

        const TrashIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        );

        const QrIcon = ({ className = "h-5 w-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
            </svg>
        );

        const CameraIcon = ({ className = "h-5 w-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path strokeLinecap="round" strokeLinejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        );

        const CloseIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        );

        const CheckCircleIcon = ({ className = "h-6 w-6 text-green-500" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 20 20" fill="currentColor">
                <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
            </svg>
        );

        // ==========================================
        // WELCOME SCREEN
        // ==========================================
        const WelcomeScreen = ({ onEnter, onQuickScan }) => {
            return (
                <div className="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col relative overflow-hidden">
                    {/* Ambient Background Shapes */}
                    <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-brand-100 rounded-full blur-3xl opacity-60 mix-blend-multiply -z-10 animate-pulse"></div>
                    <div className="absolute top-[20%] right-[-10%] w-96 h-96 bg-purple-100 rounded-full blur-3xl opacity-60 mix-blend-multiply -z-10 animate-pulse" style={{ animationDelay: '1s' }}></div>
                    <div className="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-blue-100 rounded-full blur-3xl opacity-60 mix-blend-multiply -z-10 animate-pulse" style={{ animationDelay: '2s' }}></div>

                    {/* Main Content */}
                    <main className="flex-grow flex items-center justify-center p-4 sm:p-6">
                        <div className="bg-white/80 backdrop-blur-xl border border-slate-200 shadow-2xl rounded-3xl p-8 sm:p-12 max-w-lg w-full text-center transform transition-all hover:scale-[1.01] duration-500 fade-in-view">
                            
                            {/* Logo / Icon */}
                            <div className="mx-auto w-20 h-20 bg-brand-600 rounded-2xl flex items-center justify-center mb-8 shadow-lg shadow-brand-500/30 rotate-3 hover:rotate-0 transition-transform duration-300">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                            </div>

                            {/* Titles */}
                            <div className="mb-2">
                                <span className="text-xs font-bold tracking-widest uppercase text-brand-600 bg-brand-50 px-3 py-1 rounded-full border border-brand-100">Project RAI</span>
                            </div>
                            <h1 className="text-4xl sm:text-5xl font-extrabold text-slate-900 tracking-tight mb-4">
                                Bantai
                            </h1>
                            
                            {/* Description */}
                            <p className="text-slate-600 text-base sm:text-lg mb-8 leading-relaxed">
                                A streamlined tool designed for educators to quickly log and manage phone policy violations with unique student QR scanning. Maintain a distraction-free environment and ensure uninterrupted instruction.
                            </p>

                            {/* Action Buttons */}
                            <div className="flex flex-col sm:flex-row gap-3 justify-center items-center">
                                <button 
                                    onClick={onQuickScan} 
                                    className="inline-flex items-center justify-center w-full sm:w-auto px-7 py-3.5 text-base font-bold text-white bg-red-600 rounded-full hover:bg-red-700 shadow-lg hover:shadow-red-500/40 transition-all active:scale-95 group"
                                >
                                    <QrIcon className="h-5 w-5 mr-2 group-hover:scale-110 transition-transform" />
                                    Scan Student QR
                                </button>
                                
                                <button 
                                    onClick={onEnter} 
                                    className="inline-flex items-center justify-center w-full sm:w-auto px-7 py-3.5 text-base font-semibold text-slate-700 bg-slate-100 rounded-full hover:bg-slate-200 border border-slate-300 transition-all active:scale-95"
                                >
                                    Open Tracker
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4 ml-1.5" viewBox="0 0 20 20" fill="currentColor">
                                        <path fillRule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clipRule="evenodd" />
                                    </svg>
                                </button>
                            </div>

                            {/* Subtext */}
                            <p className="mt-8 text-xs text-slate-400 font-medium flex items-center justify-center gap-1.5">
                                <CheckCircleIcon className="h-4 w-4 text-green-500" />
                                Unique QR Identification & Google Sheets Sync
                            </p>
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="w-full py-6 text-center z-10 relative">
                        <p className="text-sm text-slate-500 font-medium">
                            &copy;2016-2026 wedoIT&trade;Solutions
                        </p>
                        <p className="text-xs mt-1 text-slate-400 font-medium tracking-wide">
                            Developed by Sirmon&trade;
                        </p>
                    </footer>
                </div>
            );
        };

        // ==========================================
        // QR SCANNER MODAL COMPONENT
        // ==========================================
        const QrScannerModal = ({ isOpen, onClose, onScanSuccess }) => {
            const [scanMode, setScanMode] = useState('camera'); // 'camera' | 'upload' | 'manual'
            const [manualCode, setManualCode] = useState('');
            const [cameraError, setCameraError] = useState('');
            const [cameras, setCameras] = useState([]);
            const [selectedCameraId, setSelectedCameraId] = useState('');
            const [isScanning, setIsScanning] = useState(false);
            const scannerInstanceRef = useRef(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (!isOpen || scanMode !== 'camera') {
                    stopCamera();
                    return;
                }

                let isMounted = true;

                const initScanner = async () => {
                    setCameraError('');
                    try {
                        if (!window.Html5Qrcode) {
                            throw new Error("QR Scanning engine not loaded. Please verify your internet connection.");
                        }

                        // Stop existing scanner if running
                        await stopCamera();

                        const container = document.getElementById("qr-video-viewport");
                        if (!container) return;

                        const html5QrCode = new window.Html5Qrcode("qr-video-viewport");
                        scannerInstanceRef.current = html5QrCode;

                        // Query available cameras
                        const devices = await window.Html5Qrcode.getCameras();
                        if (isMounted && devices && devices.length > 0) {
                            setCameras(devices);
                            
                            // Select back/environment camera if available
                            const backCam = devices.find(d => 
                                d.label.toLowerCase().includes('back') || 
                                d.label.toLowerCase().includes('rear') ||
                                d.label.toLowerCase().includes('environment')
                            );
                            const targetCamId = selectedCameraId || (backCam ? backCam.id : devices[0].id);
                            if (!selectedCameraId) setSelectedCameraId(targetCamId);

                            await html5QrCode.start(
                                targetCamId,
                                {
                                    fps: 12,
                                    qrbox: { width: 240, height: 240 },
                                    aspectRatio: 1.0
                                },
                                (decodedText) => {
                                    if (isMounted) {
                                        // Play visual/haptic cue
                                        if (navigator.vibrate) navigator.vibrate(80);
                                        stopCamera().then(() => {
                                            onScanSuccess(decodedText);
                                        });
                                    }
                                },
                                (errorMessage) => {
                                    // continuous scan frame noise - ignore
                                }
                            );
                            if (isMounted) setIsScanning(true);
                        } else {
                            throw new Error("No camera found on this device. Please use Photo Upload or Manual ID entry below.");
                        }
                    } catch (err) {
                        console.warn("Camera start failed:", err);
                        if (isMounted) {
                            setCameraError(err.message || "Camera access permission was denied or unavailable.");
                            setScanMode('manual');
                        }
                    }
                };

                const timer = setTimeout(initScanner, 180);

                return () => {
                    isMounted = false;
                    clearTimeout(timer);
                    stopCamera();
                };
            }, [isOpen, scanMode, selectedCameraId]);

            const stopCamera = async () => {
                if (scannerInstanceRef.current) {
                    try {
                        if (scannerInstanceRef.current.isScanning) {
                            await scannerInstanceRef.current.stop();
                        }
                        scannerInstanceRef.current.clear();
                    } catch (e) {
                        console.warn("Scanner shutdown error:", e);
                    }
                    scannerInstanceRef.current = null;
                    setIsScanning(false);
                }
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                try {
                    setCameraError('');
                    const html5QrCode = new window.Html5Qrcode("dummy-upload-target");
                    const decodedText = await html5QrCode.scanFile(file, true);
                    html5QrCode.clear();
                    onScanSuccess(decodedText);
                } catch (err) {
                    console.error("File scan failed:", err);
                    setCameraError("Could not detect a valid QR code in this image. Try a clearer photo or enter ID manually.");
                }
            };

            const handleManualSubmit = (e) => {
                e.preventDefault();
                if (manualCode.trim()) {
                    onScanSuccess(manualCode.trim());
                    setManualCode('');
                }
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 max-w-md w-full overflow-hidden fade-in-view relative">
                        
                        {/* Modal Header */}
                        <div className="flex justify-between items-center px-6 py-4 border-b border-slate-100 bg-slate-50/70">
                            <div className="flex items-center gap-2">
                                <div className="p-2 bg-red-100 text-red-600 rounded-xl">
                                    <QrIcon className="h-5 w-5" />
                                </div>
                                <h3 className="font-bold text-slate-800 text-lg">Scan Student QR Code</h3>
                            </div>
                            <button 
                                onClick={onClose}
                                className="p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-200 rounded-full transition-colors"
                            >
                                <CloseIcon />
                            </button>
                        </div>

                        {/* Scanner Mode Switcher */}
                        <div className="flex border-b border-slate-200 bg-slate-100/60 p-1 text-sm font-semibold">
                            <button
                                onClick={() => setScanMode('camera')}
                                className={`flex-1 py-2 text-center rounded-lg transition-all ${
                                    scanMode === 'camera' ? 'bg-white text-brand-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'
                                }`}
                            >
                                Camera
                            </button>
                            <button
                                onClick={() => setScanMode('upload')}
                                className={`flex-1 py-2 text-center rounded-lg transition-all ${
                                    scanMode === 'upload' ? 'bg-white text-brand-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'
                                }`}
                            >
                                Upload Photo
                            </button>
                            <button
                                onClick={() => setScanMode('manual')}
                                className={`flex-1 py-2 text-center rounded-lg transition-all ${
                                    scanMode === 'manual' ? 'bg-white text-brand-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'
                                }`}
                            >
                                Manual ID
                            </button>
                        </div>

                        {/* Modal Body */}
                        <div className="p-6">
                            {cameraError && (
                                <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700 font-medium">
                                    {cameraError}
                                </div>
                            )}

                            {scanMode === 'camera' && (
                                <div>
                                    {/* Camera Selector (if multi-camera) */}
                                    {cameras.length > 1 && (
                                        <div className="mb-3">
                                            <select
                                                value={selectedCameraId}
                                                onChange={(e) => setSelectedCameraId(e.target.value)}
                                                className="w-full text-xs bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-700 font-medium"
                                            >
                                                {cameras.map(cam => (
                                                    <option key={cam.id} value={cam.id}>
                                                        {cam.label || `Camera ${cam.id}`}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                    )}

                                    {/* Camera Viewport Container */}
                                    <div className="relative mx-auto rounded-2xl overflow-hidden bg-black border-2 border-slate-700 aspect-square max-w-[280px] shadow-inner flex items-center justify-center">
                                        <div id="qr-video-viewport" className="w-full h-full"></div>
                                        <div className="scan-laser pointer-events-none"></div>
                                        {!isScanning && (
                                            <div className="absolute inset-0 flex flex-col items-center justify-center text-white text-xs bg-slate-900/80 p-4 text-center">
                                                <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-white mb-2"></div>
                                                Initializing Camera...
                                            </div>
                                        )}
                                    </div>
                                    
                                    <p className="text-center text-xs text-slate-500 mt-4">
                                        Align the student's unique QR badge within the square frame.
                                    </p>
                                </div>
                            )}

                            {scanMode === 'upload' && (
                                <div className="text-center py-4">
                                    <div id="dummy-upload-target" className="hidden"></div>
                                    <input 
                                        type="file" 
                                        accept="image/*" 
                                        ref={fileInputRef} 
                                        onChange={handleFileUpload}
                                        className="hidden" 
                                    />
                                    <div 
                                        onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                        className="border-2 border-dashed border-slate-300 hover:border-brand-500 rounded-2xl p-8 cursor-pointer transition-colors bg-slate-50 hover:bg-brand-50/40"
                                    >
                                        <div className="w-12 h-12 mx-auto bg-brand-100 text-brand-600 rounded-xl flex items-center justify-center mb-3">
                                            <CameraIcon className="h-6 w-6" />
                                        </div>
                                        <p className="text-sm font-bold text-slate-700 mb-1">Upload QR Code Photo</p>
                                        <p className="text-xs text-slate-400">Click to select an image from gallery or file storage</p>
                                    </div>
                                </div>
                            )}

                            {scanMode === 'manual' && (
                                <form onSubmit={handleManualSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">
                                            Student QR / LRN Code
                                        </label>
                                        <input
                                            type="text"
                                            value={manualCode}
                                            onChange={(e) => setManualCode(e.target.value)}
                                            placeholder="e.g., LRN-102938475610 or STU-001"
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none text-sm font-medium"
                                            autoFocus
                                            required
                                        />
                                        <p className="text-xs text-slate-400 mt-1">
                                            Type or paste the unique identifier encoded on the student's QR badge.
                                        </p>
                                    </div>
                                    <button
                                        type="submit"

                                    <div>

                                <textarea

                                    placeholder="e.g., Using mobile game during group discussion..."

        // ==========================================
        // NEW STUDENT OCCURRENCE PROMPT MODAL

        const NewStudentPromptModal = ({ isOpen, onClose, scannedId, prefilledData, onCreateEntry }) => {

            return (

        // ==========================================
        // MAIN APPLICATION COMPONENT
        // ==========================================
        function App() {
            // View State
            const [currentView, setCurrentView] = useState('welcome');

            // Database State (Students Map & Incident Logs)
            const [studentsDb, setStudentsDb] = useState(db.getStudents());
            const [logs, setLogs] = useState(db.getLogs());

            // Form State
            const [studentIdInput, setStudentIdInput] = useState('');
            const [studentName, setStudentName] = useState('');
            const [selectedGrade, setSelectedGrade] = useState('');
            const [selectedSection, setSelectedSection] = useState('');
            const [currentAdviser, setCurrentAdviser] = useState('');
            const [notes, setNotes] = useState('');
            
            // Submission & Modal States
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState({ type: '', message: '' });
            const [isScannerOpen, setIsScannerOpen] = useState(false);
            
            // Student Prompt States
            const [existingStudentModal, setExistingStudentModal] = useState({
                isOpen: false,
                student: null,
                occurrenceNumber: 1
            });
            const [newStudentModal, setNewStudentModal] = useState({
                isOpen: false,
                scannedId: '',
                prefilledData: null
            });

            // Mode indicator: when actively creating entry from a scanned QR
            const [qrRegistrationActive, setQrRegistrationActive] = useState(null);

            // Ref for auto-focus
            const nameInputRef = useRef(null);

            // Google Apps Script Web App URL
            const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxadSZUoa6e2MRyLF87PiAQwAdRfMT-jtx09OkoUxAuGNegqWLihNK3K2DTBbmDB7Xyhg/exec'; 

            // Save persistent data on changes
            useEffect(() => {
                db.saveStudents(studentsDb);
            }, [studentsDb]);

            useEffect(() => {
                db.saveLogs(logs);
            }, [logs]);

            // Grade Change Handler
            const handleGradeChange = (e) => {
                const grade = e.target.value;
                setSelectedGrade(grade);
                setSelectedSection(''); 
                setCurrentAdviser(''); 
            };

            // Section Change Handler
            const handleSectionChange = (e) => {
                const sectionName = e.target.value;
                setSelectedSection(sectionName);
                
                if (selectedGrade && sectionName) {
                    const sectionObj = SCHOOL_DATA[selectedGrade]?.find(s => s.name === sectionName);
                    setCurrentAdviser(sectionObj ? sectionObj.adviser : '');
                } else {
                    setCurrentAdviser('');
                }
            };

            // ==========================================
            // QR SCAN LOGIC & OCCURRENCE ENGINE
            // ==========================================
            const handleScanSuccess = (decodedRaw) => {
                setIsScannerOpen(false);
                let scannedCode = decodedRaw.trim();
                let parsedJson = null;

                // Check for JSON payload encoded in QR
                try {
                    if (scannedCode.startsWith('{') && scannedCode.endsWith('}')) {
                        parsedJson = JSON.parse(scannedCode);
                        if (parsedJson.studentId) scannedCode = parsedJson.studentId.trim();
                        else if (parsedJson.id) scannedCode = parsedJson.id.trim();
                        else if (parsedJson.lrn) scannedCode = parsedJson.lrn.trim();
                    }
                } catch (e) {
                    // Raw string
                }

                // Check database for student existence
                const existing = studentsDb[scannedCode];

                if (existing) {
                    // CASE 1: Student exists in DB! Tied to existing student.
                    const nextOcc = (existing.totalOccurrences || 0) + 1;
                    setExistingStudentModal({
                        isOpen: true,
                        student: existing,
                        occurrenceNumber: nextOcc
                    });
                } else {
                    // CASE 2: No occurrence yet for this student in DB! Ask to create entry.
                    setNewStudentModal({
                        isOpen: true,
                        scannedId: scannedCode,
                        prefilledData: parsedJson
                    });
                }
            };

            // Confirm Incident for Existing Student (Fast Log)
            const handleConfirmExistingStudent = async (student, occurrenceNumber, modalNotes) => {
                setIsSubmitting(true);
                const timestamp = new Date().toISOString();

                const newIncident = {
                    id: Date.now().toString(),
                    studentId: student.studentId,
                    studentName: student.studentName,
                    grade: student.grade,
                    section: student.section,
                    adviser: student.adviser,
                    occurrenceNumber: occurrenceNumber,
                    notes: modalNotes.trim(),
                    timestamp: timestamp
                };

                // Update student occurrence count
                const updatedStudents = {
                    ...studentsDb,
                    [student.studentId]: {
                        ...student,
                        totalOccurrences: occurrenceNumber,
                        lastRecordedAt: timestamp
                    }
                };

                setStudentsDb(updatedStudents);
                setLogs([newIncident, ...logs]);

                // Sync to Google Sheets
                try {
                    if (GOOGLE_SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                        await fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(newIncident),
                        });
                    }
                } catch (err) {
                    console.warn("Cloud sync deferred:", err);
                } finally {
                    setIsSubmitting(false);
                    setExistingStudentModal({ isOpen: false, student: null, occurrenceNumber: 1 });
                    setSubmitStatus({ 
                        type: 'success', 
                        message: `Violation recorded for ${student.studentName} (Occurrence #${occurrenceNumber})!` 
                    });
                    setTimeout(() => setSubmitStatus({ type: '', message: '' }), 3500);
                }
            };

            // Switch to Entry Form for New Student
            const handleStartNewStudentEntry = (scannedId, prefilled) => {
                setNewStudentModal({ isOpen: false, scannedId: '', prefilledData: null });
                setCurrentView('tracker');
                
                // Pre-fill form fields
                setStudentIdInput(scannedId);
                setQrRegistrationActive(scannedId);

                if (prefilled) {
                    if (prefilled.name) setStudentName(prefilled.name);
                    if (prefilled.grade) setSelectedGrade(prefilled.grade);
                    if (prefilled.section) {
                        setSelectedSection(prefilled.section);
                        if (prefilled.grade && SCHOOL_DATA[prefilled.grade]) {
                            const sec = SCHOOL_DATA[prefilled.grade].find(s => s.name === prefilled.section);
                            if (sec) setCurrentAdviser(sec.adviser);
                        }
                    }
                }

                // Focus on student name
                setTimeout(() => {
                    if (nameInputRef.current) nameInputRef.current.focus();
                }, 100);
            };

            // Cancel QR Registration Mode
            const handleCancelQrMode = () => {
                setQrRegistrationActive(null);
                setStudentIdInput('');
            };

            // Standard / New Student Form Submit
            const handleSubmit = async (e) => {
                e.preventDefault();
                
                if (!studentName.trim() || !selectedGrade || !selectedSection) {
                    setSubmitStatus({ type: 'error', message: 'Please fill in all required fields.' });
                    return; 
                }

                setIsSubmitting(true);
                setSubmitStatus({ type: '', message: '' });

                const effectiveId = (studentIdInput.trim()) || `STU-${Date.now().toString().slice(-6)}`;
                const existing = studentsDb[effectiveId];
                const occNumber = existing ? (existing.totalOccurrences || 0) + 1 : 1;
                const timestamp = new Date().toISOString();

                const newLog = {
                    id: Date.now().toString(),
                    studentId: effectiveId,
                    studentName: studentName.trim(),
                    grade: selectedGrade,
                    section: selectedSection,
                    adviser: currentAdviser,
                    occurrenceNumber: occNumber,
                    notes: notes.trim(),
                    timestamp: timestamp
                };

                // Register / update student in DB
                const updatedStudents = {
                    ...studentsDb,
                    [effectiveId]: {
                        studentId: effectiveId,
                        studentName: studentName.trim(),
                        grade: selectedGrade,
                        section: selectedSection,
                        adviser: currentAdviser,
                        totalOccurrences: occNumber,
                        firstRecordedAt: existing?.firstRecordedAt || timestamp,
                        lastRecordedAt: timestamp
                    }
                };

                setStudentsDb(updatedStudents);
                setLogs([newLog, ...logs]);

                try {
                    if (GOOGLE_SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                        await fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(newLog),
                        });
                    }
                    
                    // Reset form
                    setStudentIdInput('');
                    setStudentName('');
                    setSelectedGrade('');
                    setSelectedSection('');
                    setCurrentAdviser('');
                    setNotes('');
                    setQrRegistrationActive(null);
                    
                    setSubmitStatus({ 
                        type: 'success', 
                        message: `Incident recorded successfully for ${newLog.studentName} (Occurrence #${occNumber})!` 
                    });
                    
                    if (nameInputRef.current) nameInputRef.current.focus();
                    setTimeout(() => setSubmitStatus({ type: '', message: '' }), 3500);

                } catch (error) {
                    console.error("Error submitting data:", error);
                    setSubmitStatus({ type: 'error', message: 'Failed to record incident to Google Sheets, saved locally.' });
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleDelete = (idToRemove) => {
                setLogs(logs.filter(log => log.id !== idToRemove));
            };

            // Format timestamp for display
            const formatDate = (isoString) => {
                const date = new Date(isoString);
                return date.toLocaleString('en-US', { 
                    month: 'short', 
                    day: 'numeric', 
                    hour: 'numeric', 
                    minute: '2-digit',
                    hour12: true 
                });
            };

            if (currentView === 'welcome') {
                return (
                    <WelcomeScreen 
                        onEnter={() => setCurrentView('tracker')} 
                        onQuickScan={() => {
                            setCurrentView('tracker');
                            setIsScannerOpen(true);
                        }}
                    />
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 fade-in-view">
                    
                    {/* Header */}
                    <header className="bg-slate-900 text-white shadow-md py-5 px-4 sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentView('welcome')}>
                                <div className="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center font-black text-white shadow-md">
                                    B
                                </div>
                                <div>
                                    <h1 className="text-2xl font-black tracking-tight leading-none">PROJECT RAI</h1>
                                    <p className="text-slate-400 text-[11px] font-semibold tracking-widest uppercase mt-0.5">
                                        Rapid Advancement in Instruction &bull; Bantai
                                    </p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <button
                                    onClick={() => setIsScannerOpen(true)}
                                    className="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-full text-sm shadow-md hover:shadow-red-500/30 flex items-center gap-2 transition-all active:scale-95"
                                >
                                    <QrIcon className="h-4 w-4" />
                                    <span>Scan Student QR</span>
                                </button>
                                
                                <span className="text-slate-300 text-xs font-semibold bg-slate-800 px-3 py-2 rounded-full border border-slate-700">
                                    Students in DB: {Object.keys(studentsDb).length}
                                </span>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-grow w-full max-w-7xl mx-auto p-4 sm:p-6 lg:py-8 grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
                        
                        {/* Left Column: Form & QR Actions */}
                        <div className="lg:col-span-5 h-fit space-y-4">
                            
                            {/* QR Quick Scan Banner Button */}
                            <div 
                                onClick={() => setIsScannerOpen(true)}
                                className="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-700 hover:to-rose-700 text-white p-4 rounded-2xl shadow-md cursor-pointer transition-all hover:scale-[1.01] active:scale-[0.99] flex items-center justify-between"
                            >
                                <div className="flex items-center gap-3">
                                    <div className="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                                        <QrIcon className="h-7 w-7 text-white" />
                                    </div>
                                    <div>
                                        <h3 className="font-extrabold text-base">Quick QR Scanner</h3>
                                        <p className="text-white/80 text-xs">Scan ID to auto-tie incident or add student</p>
                                    </div>
                                </div>
                                <div className="bg-white/20 p-2 rounded-lg">
                                    <CameraIcon className="h-5 w-5" />
                                </div>
                            </div>

                            {/* Main Entry Card */}
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 lg:p-7">
                                
                                {/* Header with Active Mode Indicator */}
                                <div className="flex items-center justify-between mb-5">
                                    <div className="flex items-center gap-2.5">
                                        <div className="bg-red-100 p-2 rounded-full">
                                            <AlertIcon />
                                        </div>
                                        <div>
                                            <h2 className="text-lg font-bold text-slate-800">
                                                {qrRegistrationActive ? 'Register New Student (1st Occurrence)' : 'Log Violation Entry'}
                                            </h2>
                                            <p className="text-xs text-slate-400">
                                                {qrRegistrationActive ? 'Assigning scanned QR to new profile' : 'Manual form or via QR scanner'}
                                            </p>
                                        </div>
                                    </div>
                                    
                                    {qrRegistrationActive && (
                                        <button 
                                            onClick={handleCancelQrMode}
                                            className="text-xs text-red-600 hover:underline font-bold"
                                        >
                                            Cancel QR
                                        </button>
                                    )}
                                </div>

                                {/* Active QR Registration Notification */}
                                {qrRegistrationActive && (
                                    <div className="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-xl flex items-center justify-between">
                                        <div className="text-xs">
                                            <span className="font-bold text-amber-900 block">QR Code Bound:</span>
                                            <span className="font-mono font-semibold text-amber-800">{qrRegistrationActive}</span>
                                        </div>
                                        <span className="bg-amber-200 text-amber-900 font-bold text-[10px] px-2 py-1 rounded-md uppercase">
                                            1st Occurrence
                                        </span>
                                    </div>
                                )}
                                
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    
                                    {/* Student QR / ID Field */}
                                    <div>
                                        <div className="flex justify-between items-center mb-1">
                                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-600" htmlFor="studentIdInput">
                                                Unique Student ID / QR Code
                                            </label>
                                            <button 
                                                type="button" 
                                                onClick={() => setIsScannerOpen(true)}
                                                className="text-xs font-bold text-brand-600 hover:text-brand-800 flex items-center gap-1"
                                            >
                                                <CameraIcon className="h-3.5 w-3.5" />
                                                Scan
                                            </button>
                                        </div>
                                        <input 
                                            type="text" 
                                            id="studentIdInput"
                                            value={studentIdInput}
                                            onChange={(e) => setStudentIdInput(e.target.value)}
                                            className="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 font-mono text-sm bg-slate-50 focus:bg-white outline-none"
                                            placeholder="e.g., LRN-102938475610 (Optional if manual)"
                                        />
                                    </div>

                                    {/* Student Name */}
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1" htmlFor="studentName">
                                            Student Full Name <span className="text-red-500">*</span>
                                        </label>
                                        <input 
                                            type="text" 
                                            id="studentName"
                                            ref={nameInputRef}
                                            value={studentName}
                                            onChange={(e) => setStudentName(e.target.value)}
                                            className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 transition-colors bg-slate-50 focus:bg-white outline-none text-sm font-medium"
                                            placeholder="e.g., Juan Dela Cruz"
                                            required
                                        />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        {/* Grade Dropdown */}
                                        <div>
                                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1" htmlFor="grade">
                                                Grade Level <span className="text-red-500">*</span>
                                            </label>
                                            <select 
                                                id="grade"
                                                value={selectedGrade}
                                                onChange={handleGradeChange}
                                                className="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 bg-slate-50 focus:bg-white outline-none cursor-pointer text-sm font-medium"
                                                required
                                            >
                                                <option value="" disabled>Select Grade...</option>
                                                {Object.keys(SCHOOL_DATA).map(grade => (
                                                    <option key={grade} value={grade}>{grade}</option>
                                                ))}
                                            </select>
                                        </div>

                                        {/* Section Dropdown */}
                                        <div>
                                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1" htmlFor="section">
                                                Section <span className="text-red-500">*</span>
                                            </label>
                                            <select 
                                                id="section"
                                                value={selectedSection}
                                                onChange={handleSectionChange}
                                                className="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 bg-slate-50 focus:bg-white outline-none cursor-pointer text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed"
                                                required
                                                disabled={!selectedGrade}
                                            >
                                                <option value="" disabled>
                                                    {selectedGrade ? "Select Section..." : "Select Grade First"}
                                                </option>
                                                {selectedGrade && SCHOOL_DATA[selectedGrade].map(section => (
                                                    <option key={section.name} value={section.name}>{section.name}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    {/* Adviser Display (Auto-populated) */}
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1" htmlFor="adviser">
                                            Designated Class Adviser
                                        </label>
                                        <input 
                                            type="text" 
                                            id="adviser"
                                            value={currentAdviser}
                                            className="w-full px-3.5 py-2 rounded-lg border border-slate-200 bg-slate-100 text-slate-600 font-medium cursor-not-allowed text-sm"
                                            placeholder="Auto-populated from section..."
                                            readOnly
                                            disabled
                                        />
                                    </div>

                                    {/* Notes */}
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1" htmlFor="notes">
                                            Incident Notes <span className="text-slate-400 font-normal lowercase">(optional)</span>
                                        </label>
                                        <textarea 
                                            id="notes"
                                            value={notes}
                                            onChange={(e) => setNotes(e.target.value)}
                                            rows="2"
                                            className="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 bg-slate-50 focus:bg-white outline-none resize-none text-sm"
                                            placeholder="e.g., Playing mobile game during instructional period..."
                                        ></textarea>
                                    </div>

                                    {/* Status Feedback */}
                                    {submitStatus.message && (
                                        <div className={`p-3 rounded-xl text-xs font-semibold ${
                                            submitStatus.type === 'success' ? 'bg-green-100 text-green-800 border border-green-200' : 'bg-red-100 text-red-800 border border-red-200'
                                        }`}>
                                            {submitStatus.message}
                                        </div>
                                    )}

                                    {/* Submit Button */}
                                    <button 
                                        type="submit"
                                        disabled={isSubmitting}
                                        className={`w-full text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all flex justify-center items-center gap-2 text-sm
                                            ${isSubmitting 
                                                ? 'bg-slate-400 cursor-not-allowed' 
                                                : 'bg-red-600 hover:bg-red-700 hover:shadow-lg active:scale-[0.98]'
                                            }`}
                                    >
                                        {isSubmitting ? (
                                            <span className="flex items-center gap-2">
                                                <span className="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span>
                                                Recording Incident...
                                            </span>
                                        ) : qrRegistrationActive ? (
                                            'Create Student Entry & Log 1st Offense'
                                        ) : (
                                            'Record Incident Entry'
                                        )}
                                    </button>
                                </form>
                            </div>
                        </div>

                        {/* Right Column: Recent Incident Logs */}
                        <div className="lg:col-span-7 flex flex-col h-full min-h-[500px]">
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 lg:p-7 flex flex-col h-full">
                                
                                <div className="flex justify-between items-center mb-5 pb-3 border-b border-slate-100">
                                    <div>
                                        <h2 className="text-xl font-bold text-slate-800">Incident Feed</h2>
                                        <p className="text-xs text-slate-400">Chronological history with occurrence tracking</p>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="bg-brand-50 text-brand-700 text-xs font-extrabold px-3 py-1 rounded-full border border-brand-200">
                                            Total: {logs.length}
                                        </span>
                                    </div>
                                </div>

                                <div className="flex-grow overflow-y-auto custom-scrollbar pr-1 space-y-3.5 max-h-[720px]">
                                    {logs.length === 0 ? (
                                        <div className="text-center py-16 text-slate-400 flex flex-col items-center">
                                            <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-3 text-slate-300">
                                                <QrIcon className="h-8 w-8" />
                                            </div>
                                            <p className="font-semibold text-slate-600 text-sm">No incidents recorded yet.</p>
                                            <p className="text-xs mt-1">Scan a student's unique QR badge or use the form to record violations.</p>
                                        </div>
                                    ) : (
                                        logs.map((log) => {
                                            const occ = log.occurrenceNumber || 1;
                                            return (
                                                <div key={log.id} className="bg-slate-50 border border-slate-200 rounded-2xl p-4 hover:shadow-md transition-shadow group relative">
                                                    <div className="flex justify-between items-start gap-2">
                                                        <div>
                                                            <div className="flex items-center gap-2 flex-wrap">
                                                                <h3 className="font-extrabold text-slate-800 text-base">{log.studentName}</h3>
                                                                
                                                                {/* Occurrence Badge */}
                                                                <span className={`text-[10px] font-black uppercase px-2 py-0.5 rounded-full border ${
                                                                    occ === 1 
                                                                        ? 'bg-blue-100 text-blue-800 border-blue-200' 
                                                                        : occ === 2 
                                                                        ? 'bg-amber-100 text-amber-800 border-amber-300' 
                                                                        : 'bg-red-100 text-red-800 border-red-300 font-extrabold'
                                                                }`}>
                                                                    {occ === 1 ? '1st Offense' : occ === 2 ? '2nd Offense' : `Repeat Offense (#${occ})`}
                                                                </span>

                                                                {/* Student ID / QR Badge */}
                                                                {log.studentId && (
                                                                    <span className="text-[10px] font-mono font-semibold bg-slate-200 text-slate-700 px-2 py-0.5 rounded">
                                                                        QR: {log.studentId}
                                                                    </span>
                                                                )}
                                                            </div>

                                                            <div className="flex items-center gap-2 text-xs text-brand-700 font-bold mt-1.5">
                                                                <span className="bg-brand-50 px-2 py-0.5 rounded border border-brand-100">{log.grade}</span>
                                                                <span>&bull;</span>
                                                                <span className="bg-brand-50 px-2 py-0.5 rounded border border-brand-100">{log.section}</span>
                                                            </div>
                                                            
                                                            {log.adviser && (
                                                                <div className="text-xs text-slate-500 mt-1">
                                                                    Adviser: <span className="font-semibold text-slate-700">{log.adviser}</span>
                                                                </div>
                                                            )}
                                                        </div>

                                                        <div className="text-right flex flex-col items-end">
                                                            <span className="text-[11px] font-medium text-slate-500 bg-slate-200 px-2.5 py-1 rounded-md">
                                                                {formatDate(log.timestamp)}
                                                            </span>
                                                            
                                                            <button 
                                                                onClick={() => handleDelete(log.id)}
                                                                className="mt-2 text-slate-400 hover:text-red-500 transition-colors p-1"
                                                                title="Delete log entry"
                                                            >
                                                                <TrashIcon />
                                                            </button>
                                                        </div>
                                                    </div>

                                                    {log.notes && (
                                                        <div className="text-xs text-slate-600 mt-3 bg-white p-2.5 rounded-xl border border-slate-200">
                                                            <span className="font-bold text-slate-700 block mb-0.5">Notes:</span>
                                                            {log.notes}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* QR Scanner Modal */}
                    <QrScannerModal
                        isOpen={isScannerOpen}
                        onClose={() => setIsScannerOpen(false)}
                        onScanSuccess={handleScanSuccess}
                    />

                    {/* Existing Student Confirmation Modal */}
                    <ExistingStudentModal
                        isOpen={existingStudentModal.isOpen}
                        onClose={() => setExistingStudentModal({ isOpen: false, student: null, occurrenceNumber: 1 })}
                        student={existingStudentModal.student}
                        occurrenceNumber={existingStudentModal.occurrenceNumber}
                        onConfirm={handleConfirmExistingStudent}
                        isSubmitting={isSubmitting}
                    />

                    {/* New Student Occurrence Prompt Modal */}
                    <NewStudentPromptModal
                        isOpen={newStudentModal.isOpen}
                        onClose={() => setNewStudentModal({ isOpen: false, scannedId: '', prefilledData: null })}
                        scannedId={newStudentModal.scannedId}
                        prefilledData={newStudentModal.prefilledData}
                        onCreateEntry={handleStartNewStudentEntry}
                    />

                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-400 py-6 text-center mt-auto border-t border-slate-800">
                        <p className="text-sm">
                            &copy;2016-2026 wedoIT&trade;Solutions
                        </p>
                        <p className="text-xs mt-1 text-slate-500">
                            Developed by Sirmon&trade;
                        </p>
                    </footer>
                </div>
            );
        }

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
