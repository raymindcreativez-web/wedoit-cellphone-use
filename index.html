            'sw.js': `/**
 * Bantai - Project RAI | Service Worker (v1.2.0 Offline-First Release)
 * Pre-caches App Shell + CDN dependencies for instant zero-connectivity classroom boot.
 */
const CACHE_NAME = 'bantai-pwa-v1.2.0';
const FONT_CACHE_NAME = 'bantai-fonts-v1.2.0';

const PRECACHE_ASSETS = [
  './',
  './index.html',
  './manifest.json',
  'https://cdn.tailwindcss.com',
  'https://unpkg.com/react@18/umd/react.production.min.js',
  'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
  'https://unpkg.com/@babel/standalone/babel.min.js',
  'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'
];

self.addEventListener('install', (event) => {
  self.skipWaiting();
  event.waitUntil(
    caches.open(CACHE_NAME).then(async (cache) => {
      for (const url of PRECACHE_ASSETS) {
        try {
          await cache.add(url);
        } catch (err) {
          console.warn('[SW] Pre-cache skipped for:', url, err);
        }
      }
    })
  );
});

self.addEventListener('activate', (event) => {
  event.waitUntil(
    caches.keys().then((keys) =>
      Promise.all(
        keys
          .filter((key) => key !== CACHE_NAME && key !== FONT_CACHE_NAME)
          .map((oldKey) => caches.delete(oldKey))
      )
    ).then(() => self.clients.claim())
  );
});

self.addEventListener('fetch', (event) => {
  const { request } = event;
  const url = new URL(request.url);

  // 1. Bypass Service Worker for Google Apps Script API calls (handled by Outbox Sync Engine)
  if (url.hostname.includes('script.google.com') || url.hostname.includes('googleusercontent.com')) {
    return;
  }

  if (request.method !== 'GET') {
    return;
  }

  // 2. Google Fonts: Stale-While-Revalidate
  if (url.hostname.includes('fonts.googleapis.com') || url.hostname.includes('fonts.gstatic.com')) {
    event.respondWith(
      caches.open(FONT_CACHE_NAME).then((cache) =>
        cache.match(request).then((cachedResponse) => {
          const fetchPromise = fetch(request).then((networkResponse) => {
            if (networkResponse && networkResponse.status === 200) {
              cache.put(request, networkResponse.clone());
            }
            return networkResponse;
          }).catch(() => cachedResponse);
          return cachedResponse || fetchPromise;
        })
      )
    );
    return;
  }

  // 3. App Shell & CDN Dependencies: Cache-First falling back to Network
  event.respondWith(
    caches.match(request, { ignoreSearch: true }).then((cachedResponse) => {
      if (cachedResponse) {
        return cachedResponse;
      }
      return fetch(request).then((networkResponse) => {
        if (networkResponse && (networkResponse.status === 200 || networkResponse.type === 'opaque')) {
          const responseClone = networkResponse.clone();
          caches.open(CACHE_NAME).then((cache) => cache.put(request, responseClone));
        }
        return networkResponse;
      }).catch(() => {
        if (request.mode === 'navigate') {
          return caches.match('./index.html');
        }
      });
    })
  );
});`,
            'Code.gs': `/**
 * Bantai - Project RAI | Google Apps Script Backend (v1.2.0 Offline-First & Idempotent Release)
 */
const SHEET_ID = '1dzLSgQwH17jPUH-y3eBv6CZ5QMAmsrR9SlnhzWty3bE';
const SHEET_NAME = 'Sheet1';

const HEADERS = [
  'ID',
  'Timestamp',
  'Student ID / QR',
  'Student Name',
  'Grade',
  'Section',
  'Adviser',
  'Occurrence #',
  'Notes'
];

function doGet(e) {
  if (e && e.parameter && e.parameter.action === 'getIncidents') {
    return ContentService.createTextOutput(JSON.stringify(getIncidents()))
      .setMimeType(ContentService.MimeType.JSON);
  }

  return HtmlService
    .createHtmlOutputFromFile('index')
    .setTitle('Bantai - Project RAI')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}

function doPost(e) {
  try {
    const rawData = e && e.postData && e.postData.contents ? JSON.parse(e.postData.contents) : null;
    if (!rawData) {
      throw new Error('No JSON payload detected in request body.');
    }

    // Support Batch Offline Queue Sync
    if (rawData.action === 'batchSync' && Array.isArray(rawData.incidents)) {
      const batchResult = saveBatchIncidents(rawData.incidents);
      return ContentService.createTextOutput(JSON.stringify(batchResult))
        .setMimeType(ContentService.MimeType.JSON);
    }

    // Backwards-compatible single incident save
    const saved = saveIncident(rawData);
    return ContentService.createTextOutput(JSON.stringify(saved))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({
      result: 'error',
      message: err.message
    })).setMimeType(ContentService.MimeType.JSON);
  }
}

function getExistingIdsSet_(sheet) {
  const lastRow = sheet.getLastRow();
  const idSet = {};
  if (lastRow <= 1) return idSet;
  const ids = sheet.getRange(2, 1, lastRow - 1, 1).getValues();
  for (let i = 0; i < ids.length; i++) {
    const val = String(ids[i][0] || '').trim();
    if (val) idSet[val] = true;
  }
  return idSet;
}

function saveIncident(data) {
  if (!data) throw new Error('No incident data received.');
  const sheet = getSheet_();
  ensureHeaders_(sheet);

  const existingIds = getExistingIdsSet_(sheet);
  const id = String(data.id || Utilities.getUuid()).trim();

  // Idempotency Guard: skip if ID already exists in Sheet1
  if (existingIds[id]) {
    return { result: 'already_exists', id: id };
  }

  const row = formatIncidentRow_(data, id);
  sheet.appendRow(row);

  return {
    result: 'success',
    data: {
      id: row[0],
      timestamp: row[1],
      studentId: row[2],
      studentName: row[3],
      grade: row[4],
      section: row[5],
      adviser: row[6],
      occurrenceNumber: row[7],
      notes: row[8]
    }
  };
}

function saveBatchIncidents(incidentsArray) {
  const sheet = getSheet_();
  ensureHeaders_(sheet);
  const existingIds = getExistingIdsSet_(sheet);
  const newRows = [];
  const processedIds = [];

  for (let i = 0; i < incidentsArray.length; i++) {
    const item = incidentsArray[i];
    if (!item) continue;
    const id = String(item.id || Utilities.getUuid()).trim();
    if (!existingIds[id]) {
      newRows.push(formatIncidentRow_(item, id));
      existingIds[id] = true;
    }
    processedIds.push(id);
  }

  if (newRows.length > 0) {
    const startRow = sheet.getLastRow() + 1;
    sheet.getRange(startRow, 1, newRows.length, HEADERS.length).setValues(newRows);
  }

  return {
    result: 'success',
    insertedCount: newRows.length,
    processedIds: processedIds
  };
}

function formatIncidentRow_(data, id) {
  const timestamp = data.timestamp || new Date().toISOString();
  const studentId = String(data.studentId || data.qrCode || '').trim();
  const occurrence = Number(data.occurrenceNumber || 1);
  return [
    id,
    timestamp,
    studentId,
    String(data.studentName || '').trim(),
    String(data.grade || '').trim(),
    String(data.section || '').trim(),
    String(data.adviser || '').trim(),
    occurrence,
    String(data.notes || '').trim()
  ];
}

function getIncidents() {
  const sheet = getSheet_();
  ensureHeaders_(sheet);
  const lastRow = sheet.getLastRow();
  if (lastRow <= 1) return [];

  const values = sheet.getRange(2, 1, lastRow - 1, HEADERS.length).getValues();
  return values
    .map(function(row) {
      return {
        id: String(row[0] || ''),
        timestamp: normalizeTimestamp_(row[1]),
        studentId: String(row[2] || ''),
        studentName: String(row[3] || ''),
        grade: String(row[4] || ''),
        section: String(row[5] || ''),
        adviser: String(row[6] || ''),
        occurrenceNumber: Number(row[7] || 1),
        notes: String(row[8] || '')
      };
    })
    .filter(function(item) {
      return item.id || item.studentName;
    })
    .reverse();
}

function getSheet_() {
  const ss = SpreadsheetApp.openById(SHEET_ID);
  let sheet = ss.getSheetByName(SHEET_NAME);
  if (!sheet) sheet = ss.insertSheet(SHEET_NAME);
  return sheet;
}

function ensureHeaders_(sheet) {
  if (sheet.getLastRow() === 0) {
    sheet.getRange(1, 1, 1, HEADERS.length).setValues([HEADERS]);
    sheet.setFrozenRows(1);
    return;
  }

            const stopCamera = async () => {

                    try {
                        if (scannerInstanceRef.current.isScanning) {

                    setErrorMessage(
                        "Browser Security Restriction: Mobile browsers block camera access on unencrypted HTTP. " +
                        "Please use HTTPS or localhost, or use Upload Photo / Manual ID below."
                    );
                    return;

                    setCameraStatus('error');
                    setErrorKind('unsupported');
                    setErrorMessage("Your browser does not expose the MediaDevices camera API in this window context.");
                    return;

                        },

                    await html5QrCode.start(

        function App() {
            // Check URL deep-link parameter (?action=scan) from PWA home-screen shortcut
            const initialUrlParams = new URLSearchParams(window.location.search);
            const launchedWithScanShortcut = initialUrlParams.get('action') === 'scan';

            // View State
            const [currentView, setCurrentView] = useState(launchedWithScanShortcut ? 'tracker' : 'welcome');

            // Database State (Students Map, Incident Logs, Outbox Sync Queue, Meta)
            const [studentsDb, setStudentsDb] = useState(() => db.getStudents());
            const [logs, setLogs] = useState(() => db.getLogs());
            const [syncQueue, setSyncQueue] = useState(() => db.getSyncQueue());
            const [meta, setMeta] = useState(() => db.getMeta());

            // Network & Offline Simulator State
            const [browserOnline, setBrowserOnline] = useState(() => navigator.onLine);
            const [simulateOffline, setSimulateOffline] = useState(false);
            const [isSyncingQueue, setIsSyncingQueue] = useState(false);
            const [swStatusLabel, setSwStatusLabel] = useState('Offline Queue Active');

            // PWA Install Prompt State
            const [deferredInstallPrompt, setDeferredInstallPrompt] = useState(null);
            const [isFilesModalOpen, setIsFilesModalOpen] = useState(false);

            // Form State
            const [studentIdInput, setStudentIdInput] = useState('');
            const [studentName, setStudentName] = useState('');
            const [selectedGrade, setSelectedGrade] = useState('');
            const [selectedSection, setSelectedSection] = useState('');
            const [currentAdviser, setCurrentAdviser] = useState('');
            const [notes, setNotes] = useState('');

            // Feed Search & Filter State
            const [searchQuery, setSearchQuery] = useState('');
            const [filterGrade, setFilterGrade] = useState('ALL');
            const [filterSync, setFilterSync] = useState('ALL'); // 'ALL' | 'pending' | 'synced'
            
            // Submission & Modal States
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState({ type: '', message: '' });
            const [isScannerOpen, setIsScannerOpen] = useState(launchedWithScanShortcut);
            
            // Student Prompt States
            const [existingStudentModal, setExistingStudentModal] = useState({
                isOpen: false,
                student: null,
                occurrenceNumber: 1
            });
            const [newStudentModal, setNewStudentModal] = useState({
                isOpen: false,
                scannedId: '',
                prefilledData: null
            });

            // Mode indicator: when actively creating entry from a scanned QR
            const [qrRegistrationActive, setQrRegistrationActive] = useState(null);

            // Refs for concurrency lock and state access inside event listeners
            const nameInputRef = useRef(null);
            const isSyncingRef = useRef(false);
            const syncQueueRef = useRef(syncQueue);
            const logsRef = useRef(logs);
            const effectiveOnlineRef = useRef(browserOnline && !simulateOffline);

            // Google Apps Script Web App URL
            const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxadSZUoa6e2MRyLF87PiAQwAdRfMT-jtx09OkoUxAuGNegqWLihNK3K2DTBbmDB7Xyhg/exec';

            const isEffectiveOnline = browserOnline && !simulateOffline;

            // Keep refs synchronized with state
            useEffect(() => {
                syncQueueRef.current = syncQueue;
                db.saveSyncQueue(syncQueue);
            }, [syncQueue]);

            useEffect(() => {
                logsRef.current = logs;
                db.saveLogs(logs);
            }, [logs]);

            useEffect(() => {
                db.saveStudents(studentsDb);
            }, [studentsDb]);

            useEffect(() => {
                db.saveMeta(meta);
            }, [meta]);

            useEffect(() => {
                effectiveOnlineRef.current = isEffectiveOnline;
            }, [isEffectiveOnline]);

            const flushSyncQueue = useCallback(async (manualTrigger = false) => {
                if (isSyncingRef.current) return;
                if (!effectiveOnlineRef.current) {
                    if (manualTrigger) {
                        setSubmitStatus({
                            type: 'warning',
                            message: 'Device is currently in Offline Mode. Queued records are safely stored and will auto-sync when online.'
                        });
                        setTimeout(() => setSubmitStatus({ type: '', message: '' }), 3500);
                    }
                    return;
                }

                const currentQueue = syncQueueRef.current;
                if (!currentQueue || currentQueue.length === 0) {
                    if (manualTrigger) {
                        setSubmitStatus({
                            type: 'success',
                            message: 'All local incident records are already synced with Google Sheets!'
                        });
                        setTimeout(() => setSubmitStatus({ type: '', message: '' }), 3000);
                    }
                    return;
                }

                isSyncingRef.current = true;
                setIsSyncingQueue(true);

                const syncedIds = new Set();

                try {
                    if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                        // Dispatch each queued item with idempotent ID so both v1.1.0 and v1.2.0 Code.gs backends record cleanly
                        for (const item of currentQueue) {
                            await fetch(GOOGLE_SCRIPT_URL, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(item)
                            });
                            syncedIds.add(item.id);
                        }
                    } else {
                        currentQueue.forEach(item => syncedIds.add(item.id));
                    }

                    const nowIso = new Date().toISOString();

                    // Remove synced items from Outbox Queue
                    setSyncQueue(prev => prev.filter(q => !syncedIds.has(q.id)));

                    // Update syncStatus badge on matching logs
                    setLogs(prev => prev.map(log =>
                        syncedIds.has(log.id)
                            ? { ...log, syncStatus: 'synced', syncedAt: nowIso }
                            : log
                    ));

                    setMeta(prev => ({ ...prev, lastCloudSyncAt: nowIso }));

                    if (manualTrigger || currentQueue.length > 1) {
                        setSubmitStatus({
                            type: 'success',
                            message: `Synced ${syncedIds.size} queued incident(s) to Google Sheets!`
                        });
                        setTimeout(() => setSubmitStatus({ type: '', message: '' }), 3500);
                    }
                } catch (err) {
                    console.warn("Background queue sync deferred (network unreachable):", err);
                    if (manualTrigger) {
                        setSubmitStatus({
                            type: 'warning',
                            message: 'Cloud sync unreachable right now. Records remain safely queued on your device.'
                        });
                        setTimeout(() => setSubmitStatus({ type: '', message: '' }), 3500);
                    }
                } finally {
                    isSyncingRef.current = false;
                    setIsSyncingQueue(false);
                }
            }, []);

            useEffect(() => {
                const handleOnline = () => {
                    setBrowserOnline(true);
                    if (!simulateOffline) {
                        setTimeout(() => flushSyncQueue(false), 300);
                    }
                };
                const handleOffline = () => {
                    setBrowserOnline(false);
                };
                const handleVisibility = () => {
                    if (document.visibilityState === 'visible' && effectiveOnlineRef.current) {
                        flushSyncQueue(false);
                    }
                };
                const handleBeforeInstallPrompt = (e) => {
                    e.preventDefault();
                    setDeferredInstallPrompt(e);
                };
                const handleSwUpdate = (e) => {
                    if (e && e.detail) setSwStatusLabel(e.detail);
                };

                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                document.addEventListener('visibilitychange', handleVisibility);
                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                window.addEventListener('bantai-sw-update', handleSwUpdate);

                // 30-second periodic background heartbeat for pending queue items
                const heartbeat = setInterval(() => {
                    if (effectiveOnlineRef.current && syncQueueRef.current.length > 0) {
                        flushSyncQueue(false);
                    }
                }, 30000);

                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                    document.removeEventListener('visibilitychange', handleVisibility);
                    window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                    window.removeEventListener('bantai-sw-update', handleSwUpdate);
                    clearInterval(heartbeat);
                };
            }, [flushSyncQueue, simulateOffline]);

            // Automatically flush when user switches off "Simulate Offline" mode
            useEffect(() => {
                if (isEffectiveOnline && syncQueue.length > 0) {
                    flushSyncQueue(true);
                }
            }, [isEffectiveOnline]);

            const handleInstallPwaClick = async () => {
                if (!deferredInstallPrompt) return;
                deferredInstallPrompt.prompt();
                await deferredInstallPrompt.userChoice;
                setDeferredInstallPrompt(null);
            };

            const handlePullFromCloud = async () => {
                if (!isEffectiveOnline) {
                    setSubmitStatus({
                        type: 'warning',
                        message: 'Cannot pull cloud roster while in Offline Mode.'
                    });
                    setTimeout(() => setSubmitStatus({ type: '', message: '' }), 3000);
                    return;
                }
                setIsSyncingQueue(true);
                try {
                    const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getIncidents`);
                    if (res.ok) {
                        const cloudIncidents = await res.json();
                        if (Array.isArray(cloudIncidents) && cloudIncidents.length > 0) {
                            const existingIds = new Set(logsRef.current.map(l => String(l.id)));
                            const mergedLogs = [...logsRef.current];
                            let addedCount = 0;

                            cloudIncidents.forEach(item => {
                                const cid = String(item.id || '');
                                if (cid && !existingIds.has(cid)) {
                                    mergedLogs.push({
                                        ...item,
                                        syncStatus: 'synced',
                                        syncedAt: item.timestamp
                                    });
                                    existingIds.add(cid);
                                    addedCount++;
                                }
                            });

                            // Sort newest first
                            mergedLogs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                            setLogs(mergedLogs);
                            recalculateStudentsFromLogs(mergedLogs);

                            setSubmitStatus({
                                type: 'success',
                                message: addedCount > 0
                                    ? `Hydrated ${addedCount} cloud incident(s) from Google Sheets!`
                                    : 'Local database is already up-to-date with Google Sheets.'
                            });
                            setTimeout(() => setSubmitStatus({ type: '', message: '' }), 3500);
                        }
                    }
                } catch (err) {
                    setSubmitStatus({
                        type: 'warning',
                        message: 'Cloud hydration skipped (CORS/Offline). Local database remains intact.'
                    });
                    setTimeout(() => setSubmitStatus({ type: '', message: '' }), 3500);
                } finally {
                    setIsSyncingQueue(false);
                }
            };

            // Recalculate student occurrence counters accurately from log history
            const recalculateStudentsFromLogs = (currentLogs) => {
                const updatedMap = { ...studentsDb };
                // Reset counts first
                Object.keys(updatedMap).forEach(sid => {
                    updatedMap[sid] = { ...updatedMap[sid], totalOccurrences: 0 };
                });

                // Count chronological occurrences per student
                const chronological = [...currentLogs].reverse();
                chronological.forEach(log => {
                    const sid = log.studentId;
                    if (!sid) return;
                    const prevCount = updatedMap[sid]?.totalOccurrences || 0;
                    updatedMap[sid] = {
                        studentId: sid,
                        studentName: log.studentName || updatedMap[sid]?.studentName || '',
                        grade: log.grade || updatedMap[sid]?.grade || '',
                        section: log.section || updatedMap[sid]?.section || '',
                        adviser: log.adviser || updatedMap[sid]?.adviser || '',
                        totalOccurrences: prevCount + 1,
                        firstRecordedAt: updatedMap[sid]?.firstRecordedAt || log.timestamp,
                        lastRecordedAt: log.timestamp
                    };
                });
                setStudentsDb(updatedMap);
            };

            // Export CSV (works 100% offline)
            const handleExportCsv = () => {
                if (logs.length === 0) return;
                const headers = ['ID', 'Timestamp', 'Student ID / QR', 'Student Name', 'Grade', 'Section', 'Adviser', 'Occurrence #', 'Sync Status', 'Notes'];
                const escapeCsv = (val) => `"${String(val ?? '').replace(/"/g, '""')}"`;

                const rows = logs.map(l => [
                    l.id,
                    l.timestamp,
                    l.studentId,
                    l.studentName,
                    l.grade,
                    l.section,
                    l.adviser,
                    l.occurrenceNumber,
                    l.syncStatus || 'synced',
                    l.notes
                ].map(escapeCsv).join(','));

                const csvContent = [headers.map(escapeCsv).join(','), ...rows].join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `bantai-incidents-${new Date().toISOString().slice(0, 10)}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const handleGradeChange = (e) => {
                const grade = e.target.value;
                setSelectedGrade(grade);
                setSelectedSection(''); 
                setCurrentAdviser(''); 
            };

            const handleSectionChange = (e) => {
                const sectionName = e.target.value;
                setSelectedSection(sectionName);
                
                if (selectedGrade && sectionName) {
                    const sectionObj = SCHOOL_DATA[selectedGrade]?.find(s => s.name === sectionName);
                    setCurrentAdviser(sectionObj ? sectionObj.adviser : '');
                } else {
                    setCurrentAdviser('');
                }
            };

            // Core Offline-First Commit Helper (<15ms immediate local resolution + Outbox enqueue)
            const commitIncidentOfflineFirst = (incidentRecord, updatedStudentProfile) => {
                // 1. Update Student Profile & Occurrence Counter
                setStudentsDb(prev => ({
                    ...prev,
                    [updatedStudentProfile.studentId]: updatedStudentProfile
                }));

                // 2. Prepend to Incident Logs with 'pending' sync status
                const nextLogs = [incidentRecord, ...logsRef.current];
                logsRef.current = nextLogs;
                setLogs(nextLogs);

                // 3. Enqueue in Persistent Outbox Sync Queue
                const nextQueue = [...syncQueueRef.current, incidentRecord];
                syncQueueRef.current = nextQueue;
                setSyncQueue(nextQueue);

                // 4. Trigger non-blocking background flush if online
                if (effectiveOnlineRef.current) {
                    setTimeout(() => flushSyncQueue(false), 60);
                }
            };

            // QR Scan Lookup & Occurrence Engine
            const handleScanSuccess = (decodedRaw) => {
                setIsScannerOpen(false);
                let scannedCode = decodedRaw.trim();
                let parsedJson = null;

                try {
                    if (scannedCode.startsWith('{') && scannedCode.endsWith('}')) {
                        parsedJson = JSON.parse(scannedCode);
                        if (parsedJson.studentId) scannedCode = parsedJson.studentId.trim();
                        else if (parsedJson.id) scannedCode = parsedJson.id.trim();
                        else if (parsedJson.lrn) scannedCode = parsedJson.lrn.trim();
                    }
                } catch (e) {}

                const existing = studentsDb[scannedCode];

                if (existing && (existing.totalOccurrences || 0) > 0) {
                    const nextOcc = (existing.totalOccurrences || 0) + 1;
                    setExistingStudentModal({
                        isOpen: true,
                        student: existing,
                        occurrenceNumber: nextOcc
                    });
                } else {
                    setNewStudentModal({
                        isOpen: true,
                        scannedId: scannedCode,
                        prefilledData: parsedJson
                    });
                }
            };

            // Confirm Incident for Existing Student (Zero-Latency Fast Log)
            const handleConfirmExistingStudent = (student, occurrenceNumber, modalNotes) => {
                setIsSubmitting(true);
                const timestamp = new Date().toISOString();
                const uniqueId = `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;

                const newIncident = {
                    id: uniqueId,
                    studentId: student.studentId,
                    studentName: student.studentName,
                    grade: student.grade,
                    section: student.section,
                    adviser: student.adviser,
                    occurrenceNumber: occurrenceNumber,
                    notes: modalNotes.trim(),
                    timestamp: timestamp,
                    syncStatus: 'pending',
                    syncedAt: null,
                    retryCount: 0
                };

                const updatedStudent = {
                    ...student,
                    totalOccurrences: occurrenceNumber,
                    lastRecordedAt: timestamp
                };

                commitIncidentOfflineFirst(newIncident, updatedStudent);

                setIsSubmitting(false);
                setExistingStudentModal({ isOpen: false, student: null, occurrenceNumber: 1 });
                setSubmitStatus({ 
                    type: 'success', 
                    message: isEffectiveOnline
                        ? `Violation recorded for ${student.studentName} (Occurrence #${occurrenceNumber}) & syncing!`
                        : `Saved Offline: ${student.studentName} (Occurrence #${occurrenceNumber}) queued for auto-sync!`
                });
                setTimeout(() => setSubmitStatus({ type: '', message: '' }), 3500);
            };

            // Switch to Entry Form for New Student
            const handleStartNewStudentEntry = (scannedId, prefilled) => {
                setNewStudentModal({ isOpen: false, scannedId: '', prefilledData: null });
                setCurrentView('tracker');
                
                setStudentIdInput(scannedId);
                setQrRegistrationActive(scannedId);

                if (prefilled) {
                    if (prefilled.name) setStudentName(prefilled.name);
                    if (prefilled.grade) setSelectedGrade(prefilled.grade);
                    if (prefilled.section) {
                        setSelectedSection(prefilled.section);
                        if (prefilled.grade && SCHOOL_DATA[prefilled.grade]) {
                            const sec = SCHOOL_DATA[prefilled.grade].find(s => s.name === prefilled.section);
                            if (sec) setCurrentAdviser(sec.adviser);
                        }
                    }
                }

                setTimeout(() => {
                    if (nameInputRef.current) nameInputRef.current.focus();
                }, 100);
            };

            const handleCancelQrMode = () => {
                setQrRegistrationActive(null);
                setStudentIdInput('');
            };

            // Standard / New Student Form Submit (Zero-Latency Local Commit)
            const handleSubmit = (e) => {
                e.preventDefault();
                
                if (!studentName.trim() || !selectedGrade || !selectedSection) {
                    setSubmitStatus({ type: 'error', message: 'Please fill in all required fields.' });
                    return; 
                }

                setIsSubmitting(true);

                const effectiveId = (studentIdInput.trim()) || `STU-${Date.now().toString().slice(-6)}`;
                const existing = studentsDb[effectiveId];
                const occNumber = existing ? (existing.totalOccurrences || 0) + 1 : 1;
                const timestamp = new Date().toISOString();
                const uniqueId = `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;

                const newLog = {
                    id: uniqueId,
                    studentId: effectiveId,
                    studentName: studentName.trim(),
                    grade: selectedGrade,
                    section: selectedSection,
                    adviser: currentAdviser,
                    occurrenceNumber: occNumber,
                    notes: notes.trim(),
                    timestamp: timestamp,
                    syncStatus: 'pending',
                    syncedAt: null,
                    retryCount: 0
                };

                const updatedStudent = {
                    studentId: effectiveId,
                    studentName: studentName.trim(),
                    grade: selectedGrade,
                    section: selectedSection,
                    adviser: currentAdviser,
                    totalOccurrences: occNumber,
                    firstRecordedAt: existing?.firstRecordedAt || timestamp,
                    lastRecordedAt: timestamp
                };

                commitIncidentOfflineFirst(newLog, updatedStudent);

                // Reset form immediately for rapid consecutive logging
                setStudentIdInput('');
                setStudentName('');
                setSelectedGrade('');
                setSelectedSection('');
                setCurrentAdviser('');
                setNotes('');
                setQrRegistrationActive(null);
                setIsSubmitting(false);

                setSubmitStatus({ 
                    type: 'success', 
                    message: isEffectiveOnline
                        ? `Incident recorded for ${newLog.studentName} (Occurrence #${occNumber}) & syncing!`
                        : `Saved Offline: ${newLog.studentName} (Occurrence #${occNumber}) queued in Outbox!`
                });
                
                if (nameInputRef.current) nameInputRef.current.focus();
                setTimeout(() => setSubmitStatus({ type: '', message: '' }), 3500);
            };

            // Smart Delete: removes from logs, cancels pending Outbox Queue entry, and recalculates occurrences
            const handleDelete = (idToRemove) => {
                const updatedLogs = logs.filter(log => log.id !== idToRemove);
                setLogs(updatedLogs);
                setSyncQueue(prev => prev.filter(q => q.id !== idToRemove));
                recalculateStudentsFromLogs(updatedLogs);
            };

            // Filtered logs for the Incident Feed
            const filteredLogs = useMemo(() => {
                return logs.filter(log => {
                    const matchesGrade = filterGrade === 'ALL' || log.grade === filterGrade;
                    const matchesSync = filterSync === 'ALL' || (log.syncStatus || 'synced') === filterSync;
                    const q = searchQuery.trim().toLowerCase();
                    const matchesSearch = !q ||
                        (log.studentName || '').toLowerCase().includes(q) ||
                        (log.studentId || '').toLowerCase().includes(q) ||
                        (log.section || '').toLowerCase().includes(q) ||
                        (log.adviser || '').toLowerCase().includes(q);
                    return matchesGrade && matchesSync && matchesSearch;
                });
            }, [logs, filterGrade, filterSync, searchQuery]);

            const formatDate = (isoString) => {
                const date = new Date(isoString);
                if (isNaN(date.getTime())) return isoString;
                return date.toLocaleString('en-US', { 
                    month: 'short', 
                    day: 'numeric', 
                    hour: 'numeric', 
                    minute: '2-digit',
                    hour12: true 
                });
            };

            if (currentView === 'welcome') {
                return (
                    <>
                        <WelcomeScreen 
                            onEnter={() => setCurrentView('tracker')} 
                            onQuickScan={() => {
                                setCurrentView('tracker');
                                setIsScannerOpen(true);
                            }}
                            isEffectiveOnline={isEffectiveOnline}
                            pendingCount={syncQueue.length}
                            canInstallPwa={!!deferredInstallPrompt}
                            onInstallPwa={handleInstallPwaClick}
                            onOpenFilesModal={() => setIsFilesModalOpen(true)}
                            swStatusLabel={swStatusLabel}
                        />
                        <PwaFilesCenterModal
                            isOpen={isFilesModalOpen}
                            onClose={() => setIsFilesModalOpen(false)}
                        />
                    </>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 fade-in-view">
                    
                    {/* Header */}
                    <header className="bg-slate-900 text-white shadow-md py-4 px-4 sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto flex flex-col lg:flex-row justify-between items-center gap-3">
                            <div className="flex items-center justify-between w-full lg:w-auto">
                                <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentView('welcome')}>
                                    <div className="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center font-black text-white shadow-md">
                                        B
                                    </div>
                                    <div>
                                        <div className="flex items-center gap-2">
                                            <h1 className="text-xl sm:text-2xl font-black tracking-tight leading-none">PROJECT RAI</h1>
                                            <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-brand-500/20 text-brand-300 border border-brand-500/30">
                                                v{APP_VERSION} PWA
                                            </span>
                                        </div>
                                        <p className="text-slate-400 text-[11px] font-semibold tracking-widest uppercase mt-0.5">
                                            Rapid Advancement in Instruction &bull; Bantai
                                        </p>
                                    </div>
                                </div>

                                <button
                                    onClick={() => setIsScannerOpen(true)}
                                    className="lg:hidden bg-red-600 hover:bg-red-700 text-white font-bold px-3.5 py-2 rounded-full text-xs shadow-md flex items-center gap-1.5"
                                >
                                    <QrIcon className="h-4 w-4" />
                                    <span>Scan QR</span>
                                </button>
                            </div>

                            {/* Live Offline-First Status & Action Bar */}
                            <div className="flex flex-wrap items-center justify-center lg:justify-end gap-2 w-full lg:w-auto">
                                
                                {/* Live Connectivity & Outbox Queue Status Pill */}
                                <div className={`flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold border transition-all ${
                                    isSyncingQueue
                                        ? 'bg-blue-950/90 text-blue-300 border-blue-700'
                                        : isEffectiveOnline
                                        ? syncQueue.length > 0
                                            ? 'bg-amber-950/90 text-amber-300 border-amber-700'
                                            : 'bg-emerald-950/80 text-emerald-300 border-emerald-700/80'
                                        : 'bg-amber-500/20 text-amber-300 border-amber-500/40'
                                }`}>
                                    <span className={`h-2 w-2 rounded-full ${
                                        isSyncingQueue
                                            ? 'bg-blue-400 animate-ping'
                                            : isEffectiveOnline
                                            ? 'bg-emerald-400'
                                            : 'bg-amber-400 animate-pulse'
                                    }`}></span>
                                    <span>
                                        {isSyncingQueue
                                            ? `Syncing ${syncQueue.length} item(s)...`
                                            : isEffectiveOnline
                                            ? syncQueue.length > 0
                                                ? `Online • ${syncQueue.length} Pending`
                                                : 'Online • All Synced'
                                            : `Offline Mode • ${syncQueue.length} Queued`}
                                    </span>

                                    {syncQueue.length > 0 && isEffectiveOnline && !isSyncingQueue && (
                                        <button
                                            onClick={() => flushSyncQueue(true)}
                                            className="ml-1 px-2 py-0.5 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-full text-[10px] font-black uppercase transition-colors"
                                        >
                                            Sync Now
                                        </button>
                                    )}
                                </div>

                                {/* Interactive Offline Simulator Toggle for QA Verification */}
                                <button
                                    type="button"
                                    onClick={() => setSimulateOffline(!simulateOffline)}
                                    title="Toggle simulated offline mode to test Outbox Queue & auto-reconnect sync"
                                    className={`px-3 py-1.5 rounded-full text-xs font-bold border transition-all flex items-center gap-1.5 ${
                                        simulateOffline
                                            ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-sm'
                                            : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border-slate-700'
                                    }`}
                                >
                                    <CloudSyncIcon className={`h-3.5 w-3.5 ${isSyncingQueue ? 'animate-spin' : ''}`} />
                                    <span>{simulateOffline ? 'Go Back Online' : 'Test Offline Mode'}</span>
                                </button>

                                {/* PWA & Code.gs Files Button */}
                                <button
                                    type="button"
                                    onClick={() => setIsFilesModalOpen(true)}
                                    className="px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center gap-1.5 transition-colors"
                                >
                                    <CodeFileIcon className="h-3.5 w-3.5 text-brand-400" />
                                    <span className="hidden sm:inline">PWA Files</span>
                                </button>

                                {deferredInstallPrompt && (
                                    <button
                                        type="button"
                                        onClick={handleInstallPwaClick}
                                        className="px-3 py-1.5 rounded-full text-xs font-bold bg-brand-600 hover:bg-brand-500 text-white flex items-center gap-1 shadow-sm"
                                    >
                                        <DownloadIcon className="h-3.5 w-3.5" />
                                        <span>Install App</span>
                                    </button>
                                )}

                                <button
                                    onClick={() => setIsScannerOpen(true)}
                                    className="hidden lg:flex bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-full text-xs shadow-md hover:shadow-red-500/30 items-center gap-1.5 transition-all active:scale-95"
                                >
                                    <QrIcon className="h-4 w-4" />
                                    <span>Scan Student QR</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Offline Reassurance Banner when Offline */}
                    {!isEffectiveOnline && (
                        <div className="bg-amber-500/15 border-b border-amber-500/30 px-4 py-2 text-center text-xs font-semibold text-amber-900 flex flex-wrap items-center justify-center gap-2">
                            <span className="inline-block w-2 h-2 rounded-full bg-amber-600 animate-ping"></span>
                            <span>
                                <strong>Offline Mode Active:</strong> All QR scans and violation entries are saved instantly to your device ({syncQueue.length} in Outbox Queue) and will automatically upload to Google Sheets as soon as connectivity returns.
                            </span>
                        </div>
                    )}

                    {}
                    <main className="flex-grow w-full max-w-7xl mx-auto p-4 sm:p-6 lg:py-8 grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
                        
                        {/* Left Column: Form & QR Actions */}
                        <div className="lg:col-span-5 h-fit space-y-4">
                            
                            {/* QR Quick Scan Banner Button */}
                            <div 
                                onClick={() => setIsScannerOpen(true)}
                                className="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-700 hover:to-rose-700 text-white p-4 rounded-2xl shadow-md cursor-pointer transition-all hover:scale-[1.01] active:scale-[0.99] flex items-center justify-between"
                            >
                                <div className="flex items-center gap-3">
                                    <div className="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                                        <QrIcon className="h-7 w-7 text-white" />
                                    </div>
                                    <div>
                                        <h3 className="font-extrabold text-base">Quick QR Scanner</h3>
                                        <p className="text-white/80 text-xs">Scan ID to auto-tie incident or add student (Offline-Ready)</p>
                                    </div>
                                </div>
                                <div className="bg-white/20 p-2 rounded-lg">
                                    <CameraIcon className="h-5 w-5" />
                                </div>
                            </div>

                            {/* Main Entry Card */}
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 lg:p-7">
                                
                                <div className="flex items-center justify-between mb-5">
                                    <div className="flex items-center gap-2.5">
                                        <div className="bg-red-100 p-2 rounded-full">
                                            <AlertIcon />
                                        </div>
                                        <div>
                                            <h2 className="text-lg font-bold text-slate-800">
                                                {qrRegistrationActive ? 'Register New Student (1st Occurrence)' : 'Log Violation Entry'}
                                            </h2>
                                            <p className="text-xs text-slate-400">
                                                {qrRegistrationActive ? 'Assigning scanned QR to new profile' : 'Zero-latency local save + automatic cloud sync'}
                                            </p>
                                        </div>
                                    </div>
                                    
                                    {qrRegistrationActive && (
                                        <button 
                                            onClick={handleCancelQrMode}
                                            className="text-xs text-red-600 hover:underline font-bold"
                                        >
                                            Cancel QR
                                        </button>
                                    )}
                                </div>

                                {qrRegistrationActive && (
                                    <div className="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-xl flex items-center justify-between">
                                        <div className="text-xs">
                                            <span className="font-bold text-amber-900 block">QR Code Bound:</span>
                                            <span className="font-mono font-semibold text-amber-800">{qrRegistrationActive}</span>
                                        </div>
                                        <span className="bg-amber-200 text-amber-900 font-bold text-[10px] px-2 py-1 rounded-md uppercase">
                                            1st Occurrence
                                        </span>
                                    </div>
                                )}
                                
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    
                                    {/* Student QR / ID Field */}
                                    <div>
                                        <div className="flex justify-between items-center mb-1">
                                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-600" htmlFor="studentIdInput">
                                                Unique Student ID / QR Code
                                            </label>
                                            <button 
                                                type="button" 
                                                onClick={() => setIsScannerOpen(true)}
                                                className="text-xs font-bold text-brand-600 hover:text-brand-800 flex items-center gap-1"
                                            >
                                                <CameraIcon className="h-3.5 w-3.5" />
                                                Scan
                                            </button>
                                        </div>
                                        <input 
                                            type="text" 
                                            id="studentIdInput"
                                            value={studentIdInput}
                                            onChange={(e) => setStudentIdInput(e.target.value)}
                                            className="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 font-mono text-sm bg-slate-50 focus:bg-white outline-none"
                                            placeholder="e.g., LRN-102938475610 (Optional if manual)"
                                        />
                                    </div>

                                    {/* Student Name */}
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1" htmlFor="studentName">
                                            Student Full Name <span className="text-red-500">*</span>
                                        </label>
                                        <input 
                                            type="text" 
                                            id="studentName"
                                            ref={nameInputRef}
                                            value={studentName}
                                            onChange={(e) => setStudentName(e.target.value)}
                                            className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 transition-colors bg-slate-50 focus:bg-white outline-none text-sm font-medium"
                                            placeholder="e.g., Juan Dela Cruz"
                                            required
                                        />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        {/* Grade Dropdown */}
                                        <div>
                                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1" htmlFor="grade">
                                                Grade Level <span className="text-red-500">*</span>
                                            </label>
                                            <select 
                                                id="grade"
                                                value={selectedGrade}
                                                onChange={handleGradeChange}
                                                className="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 bg-slate-50 focus:bg-white outline-none cursor-pointer text-sm font-medium"
                                                required
                                            >
                                                <option value="" disabled>Select Grade...</option>
                                                {Object.keys(SCHOOL_DATA).map(grade => (
                                                    <option key={grade} value={grade}>{grade}</option>
                                                ))}
                                            </select>
                                        </div>

                                        {/* Section Dropdown */}
                                        <div>
                                            <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1" htmlFor="section">
                                                Section <span className="text-red-500">*</span>
                                            </label>
                                            <select 
                                                id="section"
                                                value={selectedSection}
                                                onChange={handleSectionChange}
                                                className="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 bg-slate-50 focus:bg-white outline-none cursor-pointer text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed"
                                                required
                                                disabled={!selectedGrade}
                                            >
                                                <option value="" disabled>
                                                    {selectedGrade ? "Select Section..." : "Select Grade First"}
                                                </option>
                                                {selectedGrade && SCHOOL_DATA[selectedGrade].map(section => (
                                                    <option key={section.name} value={section.name}>{section.name}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    {/* Adviser Display (Auto-populated) */}
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1" htmlFor="adviser">
                                            Designated Class Adviser
                                        </label>
                                        <input 
                                            type="text" 
                                            id="adviser"
                                            value={currentAdviser}
                                            className="w-full px-3.5 py-2 rounded-lg border border-slate-200 bg-slate-100 text-slate-600 font-medium cursor-not-allowed text-sm"
                                            placeholder="Auto-populated from section..."
                                            readOnly
                                            disabled
                                        />
                                    </div>

                                    {/* Notes */}
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1" htmlFor="notes">
                                            Incident Notes <span className="text-slate-400 font-normal lowercase">(optional)</span>
                                        </label>
                                        <textarea 
                                            id="notes"
                                            value={notes}
                                            onChange={(e) => setNotes(e.target.value)}
                                            rows="2"
                                            className="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 bg-slate-50 focus:bg-white outline-none resize-none text-sm"
                                            placeholder="e.g., Playing mobile game during instructional period..."
                                        ></textarea>
                                    </div>

                                    {/* Status Feedback */}
                                    {submitStatus.message && (
                                        <div className={`p-3 rounded-xl text-xs font-semibold ${
                                            submitStatus.type === 'success'
                                                ? 'bg-emerald-50 text-emerald-800 border border-emerald-200'
                                                : submitStatus.type === 'warning'
                                                ? 'bg-amber-50 text-amber-900 border border-amber-200'
                                                : 'bg-red-50 text-red-800 border border-red-200'
                                        }`}>
                                            {submitStatus.message}
                                        </div>
                                    )}

                                    {/* Submit Button */}
                                    <button 
                                        type="submit"
                                        disabled={isSubmitting}
                                        className={`w-full text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all flex justify-center items-center gap-2 text-sm
                                            ${isSubmitting 
                                                ? 'bg-slate-400 cursor-not-allowed' 
                                                : 'bg-red-600 hover:bg-red-700 hover:shadow-lg active:scale-[0.98]'
                                            }`}
                                    >
                                        {qrRegistrationActive ? (
                                            'Create Student Entry & Log 1st Offense'
                                        ) : (
                                            'Record Incident Entry'
                                        )}
                                    </button>
                                </form>
                            </div>
                        </div>

                        {}
                        <div className="lg:col-span-7 flex flex-col h-full min-h-[520px]">
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 lg:p-7 flex flex-col h-full">
                                
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-slate-100">
                                    <div>
                                        <div className="flex items-center gap-2">
                                            <h2 className="text-xl font-bold text-slate-800">Incident Feed</h2>
                                            <span className="bg-brand-50 text-brand-700 text-xs font-extrabold px-2.5 py-0.5 rounded-full border border-brand-200">
                                                Total: {logs.length}
                                            </span>
                                            {syncQueue.length > 0 && (
                                                <span className="bg-amber-100 text-amber-800 text-xs font-extrabold px-2.5 py-0.5 rounded-full border border-amber-300">
                                                    {syncQueue.length} Queued
                                                </span>
                                            )}
                                        </div>
                                        <p className="text-xs text-slate-400 mt-0.5">
                                            Students in local roster: <strong>{Object.keys(studentsDb).length}</strong>
                                            {meta.lastCloudSyncAt && ` • Last synced: ${formatDate(meta.lastCloudSyncAt)}`}
                                        </p>
                                    </div>

                                    <div className="flex items-center gap-2">
                                        <button
                                            type="button"
                                            onClick={handlePullFromCloud}
                                            className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-colors"
                                            title="Pull & merge records from Google Sheets"
                                        >
                                            <CloudSyncIcon className={`h-3.5 w-3.5 ${isSyncingQueue ? 'animate-spin' : ''}`} />
                                            <span>Sync Cloud</span>
                                        </button>

                                        <button
                                            type="button"
                                            onClick={handleExportCsv}
                                            disabled={logs.length === 0}
                                            className="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-colors disabled:opacity-40"
                                            title="Export all logs to CSV (works offline)"
                                        >
                                            <DownloadIcon className="h-3.5 w-3.5" />
                                            <span>Export CSV</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Search & Filter Bar */}
                                <div className="grid grid-cols-1 sm:grid-cols-12 gap-2 mb-4">
                                    <div className="sm:col-span-6">
                                        <input
                                            type="text"
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            placeholder="Search student, QR ID, section, or adviser..."
                                            className="w-full px-3 py-1.5 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-brand-500 outline-none"
                                        />
                                    </div>
                                    <div className="sm:col-span-3">
                                        <select
                                            value={filterGrade}
                                            onChange={(e) => setFilterGrade(e.target.value)}
                                            className="w-full px-2.5 py-1.5 text-xs rounded-xl border border-slate-200 bg-slate-50 font-semibold text-slate-700 outline-none"
                                        >
                                            <option value="ALL">All Grades</option>
                                            {Object.keys(SCHOOL_DATA).map(g => (
                                                <option key={g} value={g}>{g}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div className="sm:col-span-3">
                                        <select
                                            value={filterSync}
                                            onChange={(e) => setFilterSync(e.target.value)}
                                            className="w-full px-2.5 py-1.5 text-xs rounded-xl border border-slate-200 bg-slate-50 font-semibold text-slate-700 outline-none"
                                        >
                                            <option value="ALL">All Sync States</option>
                                            <option value="pending">Pending Sync</option>
                                            <option value="synced">Cloud Synced</option>
                                        </select>
                                    </div>
                                </div>

                                {/* Feed List */}
                                <div className="flex-grow overflow-y-auto custom-scrollbar pr-1 space-y-3.5 max-h-[680px]">
                                    {filteredLogs.length === 0 ? (
                                        <div className="text-center py-16 text-slate-400 flex flex-col items-center">
                                            <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-3 text-slate-300">
                                                <QrIcon className="h-8 w-8" />
                                            </div>
                                            <p className="font-semibold text-slate-600 text-sm">
                                                {logs.length === 0 ? 'No incidents recorded yet.' : 'No incidents match your filter.'}
                                            </p>
                                            <p className="text-xs mt-1">
                                                Scan a student's unique QR badge or use the form to record violations offline or online.
                                            </p>
                                        </div>
                                    ) : (
                                        filteredLogs.map((log) => {
                                            const occ = log.occurrenceNumber || 1;
                                            const isPending = log.syncStatus === 'pending';
                                            return (
                                                <div key={log.id} className="bg-slate-50 border border-slate-200 rounded-2xl p-4 hover:shadow-md transition-shadow group relative">
                                                    <div className="flex justify-between items-start gap-2">
                                                        <div>
                                                            <div className="flex items-center gap-2 flex-wrap">
                                                                <h3 className="font-extrabold text-slate-800 text-base">{log.studentName}</h3>
                                                                
                                                                {/* Occurrence Badge */}
                                                                <span className={`text-[10px] font-black uppercase px-2 py-0.5 rounded-full border ${
                                                                    occ === 1 
                                                                        ? 'bg-blue-100 text-blue-800 border-blue-200' 
                                                                        : occ === 2 
                                                                        ? 'bg-amber-100 text-amber-800 border-amber-300' 
                                                                        : 'bg-red-100 text-red-800 border-red-300 font-extrabold'
                                                                }`}>
                                                                    {occ === 1 ? '1st Offense' : occ === 2 ? '2nd Offense' : `Repeat Offense (#${occ})`}
                                                                </span>

                                                                {/* Per-Record Offline/Cloud Sync Badge */}
                                                                <span className={`inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full border ${
                                                                    isPending
                                                                        ? 'bg-amber-50 text-amber-800 border-amber-300'
                                                                        : 'bg-emerald-50 text-emerald-700 border-emerald-200'
                                                                }`}>
                                                                    <span className={`h-1.5 w-1.5 rounded-full ${isPending ? 'bg-amber-500 animate-pulse' : 'bg-emerald-500'}`}></span>
                                                                    {isPending ? 'Pending Sync' : 'Cloud Synced'}
                                                                </span>

                                                                {/* Student ID / QR Badge */}
                                                                {log.studentId && (
                                                                    <span className="text-[10px] font-mono font-semibold bg-slate-200 text-slate-700 px-2 py-0.5 rounded">
                                                                        QR: {log.studentId}
                                                                    </span>
                                                                )}
                                                            </div>

                                                            <div className="flex items-center gap-2 text-xs text-brand-700 font-bold mt-1.5">
                                                                <span className="bg-brand-50 px-2 py-0.5 rounded border border-brand-100">{log.grade}</span>
                                                                <span>&bull;</span>
                                                                <span className="bg-brand-50 px-2 py-0.5 rounded border border-brand-100">{log.section}</span>
                                                            </div>
                                                            
                                                            {log.adviser && (
                                                                <div className="text-xs text-slate-500 mt-1">
                                                                    Adviser: <span className="font-semibold text-slate-700">{log.adviser}</span>
                                                                </div>
                                                            )}
                                                        </div>

                                                        <div className="text-right flex flex-col items-end">
                                                            <span className="text-[11px] font-medium text-slate-500 bg-slate-200 px-2.5 py-1 rounded-md">
                                                                {formatDate(log.timestamp)}
                                                            </span>
                                                            
                                                            <button 
                                                                onClick={() => handleDelete(log.id)}
                                                                className="mt-2 text-slate-400 hover:text-red-500 transition-colors p-1"
                                                                title="Delete log entry (also removes from pending queue)"
                                                            >
                                                                <TrashIcon />
                                                            </button>
                                                        </div>
                                                    </div>

                                                    {log.notes && (
                                                        <div className="text-xs text-slate-600 mt-3 bg-white p-2.5 rounded-xl border border-slate-200">
                                                            <span className="font-bold text-slate-700 block mb-0.5">Notes:</span>
                                                            {log.notes}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Modals */}
                    <QrScannerModal
                        isOpen={isScannerOpen}
                        onClose={() => setIsScannerOpen(false)}
                        onScanSuccess={handleScanSuccess}
                    />

                    <ExistingStudentModal
                        isOpen={existingStudentModal.isOpen}
                        onClose={() => setExistingStudentModal({ isOpen: false, student: null, occurrenceNumber: 1 })}
                        student={existingStudentModal.student}
                        occurrenceNumber={existingStudentModal.occurrenceNumber}
                        onConfirm={handleConfirmExistingStudent}
                        isSubmitting={isSubmitting}
                    />

                    <NewStudentPromptModal
                        isOpen={newStudentModal.isOpen}
                        onClose={() => setNewStudentModal({ isOpen: false, scannedId: '', prefilledData: null })}
                        scannedId={newStudentModal.scannedId}
                        prefilledData={newStudentModal.prefilledData}
                        onCreateEntry={handleStartNewStudentEntry}
                    />

                    <PwaFilesCenterModal
                        isOpen={isFilesModalOpen}
                        onClose={() => setIsFilesModalOpen(false)}
                    />

                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-400 py-6 text-center mt-auto border-t border-slate-800">
                        <p className="text-sm">
                            &copy;2016-2026 wedoIT&trade;Solutions &bull; Bantai v{APP_VERSION} Offline-First PWA
                        </p>
                        <p className="text-xs mt-1 text-slate-500">
                            Developed by Sirmon&trade;
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
